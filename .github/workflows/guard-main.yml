name: guard-main

on:
  push:
    branches:
      - main

jobs:
  verify-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify parents
        run: |
          PARENTS=$(git rev-list --parents -n 1 HEAD | wc -w)
          if [ "$PARENTS" -lt 3 ]; then
              echo "::error::Direct push to main detected. Main only accepts PR merges."
              exit 1
          fi
