model_id: google/gemma-4-12b-it     # locked in doc 02, Section 3
inference_provider: vllm
dtype: bfloat16
base_seed: 1234
request_timeout_seconds: 60
pattern4_num_agents: 3               # locked in doc 02, Section 4.3; do not change
pattern4_agent_seeds: [1234, 5678, 9012]   # one seed per symmetric agent
pattern4_context_ceiling_tokens: 8000       # doc 02, Section 4.2; tuned in Phase 2
samples_per_dataset:                 # provisional N=150
  popqa: 2
  livebench: 2
  finqa: 2
  ifeval: 2
pipeline_max_revisions: 2          # Pattern 2 revision-loop cap; Doc 01 Section 3
pattern3_max_iterations: 3         # 3 reasoning artifacts (1 draft + 2 revisions) = 5 LLM calls per query
pattern4_max_iterations: 2         # Pattern 4 max refinement rounds

# Dynamic Token Ceilings
role_max_tokens:
  # Generation and Research functions (High ceiling to prevent truncation across all 4 datasets, especially IFEval)
  drafter: 2048
  formatter: 2048
  researcher: 2048
  analyst: 2048
  solo_reflexive: 2048
  analyst_1: 2048
  analyst_2: 2048
  analyst_3: 2048
  
  # Evaluation functions (Lower ceiling)
  reviewer: 1024
  judge: 1024
